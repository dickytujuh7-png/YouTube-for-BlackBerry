plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dickytuj.blackberryfox'
    compileSdk 33

    defaultConfig {
        applicationId 'com.dickytuj.blackberryfox'
        minSdk 18
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-beta-armeabi-v7a:68.0.20190611143747'
}
