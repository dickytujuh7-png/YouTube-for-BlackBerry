plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dickytujuh.youtube.blackberry'
    compileSdk 33
    defaultConfig {
        applicationId 'com.dickytuj.youtube.blackberry'
        minSdk 18
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
