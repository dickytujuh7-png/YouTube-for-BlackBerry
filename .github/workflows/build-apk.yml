name: Build FeatherBrowser APK
on:
  push:
    branches: [ feather-android-server ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Create Feather launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          for density,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs(f'app/src/main/res/mipmap-{density}',exist_ok=True)
              im=Image.new('RGBA',(size,size),(17,24,32,255)); d=ImageDraw.Draw(im)
              d.rounded_rectangle((2,2,size-2,size-2),radius=size//5,fill=(35,54,69,255))
              d.polygon([(size*.22,size*.78),(size*.40,size*.20),(size*.52,size*.48),(size*.78,size*.18),(size*.63,size*.78),(size*.48,size*.58)],fill=(103,205,171,255))
              d.line((size*.26,size*.77,size*.72,size*.24),fill=(230,247,239,255),width=max(2,size//18))
              im.save(f'app/src/main/res/mipmap-{density}/feather.png')
          PY
      - name: Build ARMv7 APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FeatherBrowser-Q10-ARMv7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
