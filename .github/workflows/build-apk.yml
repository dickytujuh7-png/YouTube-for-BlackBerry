name: Build BlackBerryFox APK
on:
  push:
    branches: [ tiktok-lite ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Create BlackBerryFox launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              im = Image.new('RGBA', (size,size), (8,8,10,255))
              d = ImageDraw.Draw(im)
              pad = int(size*.08)
              d.rounded_rectangle((pad,pad,size-pad,size-pad), radius=int(size*.20), fill=(18,18,22,255))
              # Stylized black fox head, white eyes, and blue globe accent.
              d.ellipse((int(size*.24),int(size*.25),int(size*.77),int(size*.78)), fill=(0,0,0,255))
              d.polygon([(int(size*.27),int(size*.42)),(int(size*.23),int(size*.12)),(int(size*.48),int(size*.30))], fill=(0,0,0,255))
              d.polygon([(int(size*.53),int(size*.30)),(int(size*.79),int(size*.12)),(int(size*.73),int(size*.46))], fill=(0,0,0,255))
              d.polygon([(int(size*.34),int(size*.50)),(int(size*.66),int(size*.50)),(int(size*.50),int(size*.73))], fill=(235,235,240,255))
              d.ellipse((int(size*.37),int(size*.43),int(size*.43),int(size*.49)), fill=(255,255,255,255))
              d.ellipse((int(size*.57),int(size*.43),int(size*.63),int(size*.49)), fill=(255,255,255,255))
              d.ellipse((int(size*.46),int(size*.57),int(size*.54),int(size*.64)), fill=(30,130,240,255))
              im.save(f'app/src/main/res/mipmap-{density}/blackberryfox.png')
          PY
      - name: Build ARMv7 debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBerryFox-ARMv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
